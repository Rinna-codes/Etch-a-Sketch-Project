<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/Odin-Project-Etch-a-Sketch/styles/themes.css">
    <link rel="stylesheet" href="/Odin-Project-Etch-a-Sketch/styles/main.css">
    <title>Etch-a-Sketch</title>
</head>

<body>
    <!-- For the Top Bar of the web page -->
    <div id="app">
        <div class="topbar">
            <h1 id="logo-title">Etch*Sketch</h1>
            <div class="stats">
                <div class="stats-grid">grid:</div>
                <div class="stat-mode">mode:</div>
                <div class="stat-cells">cells painted:</div>
            </div>
            <div class="toggle">
                <label class="switch">
                    <input type="checkbox">
                    <span class="day-light"></span>
                </label>
            </div>
        </div>

    <!-- Main selection of app -->
        <div id="main">
            <div id="side-bar">
                <section id="section-draw-mode">
                    <h2 class="section-labels">Draw Mode</h2>
                    <button class="mode-btn" data-mode="pastel">pastel</button>
                    <button class="mode-btn" data-mode="rainbow">rainbow</button>
                    <button class="mode-btn" data-mode="darken">darken</button>
                    <button class="mode-btn" data-mode="ink">ink</button>
                    <button class="mode-btn" data-mode="eraser">erase</button>
                </section>
                <section id="section-palette">
                    <h2 class="section-labels">Color Palette</h2>
                    <div id="swatch-container">
                        <!-- Should be generated by javascript -->
                    </div>
                </section>
                <section id="section-grid">
                    <label for="grid-slider">size:</label>
                    <input type="range" id="grid-slider" name="grid-size" min="10" max="64"/>

                    <label for="brush-slider">brush:</label>
                    <input type="range" id="brush-slider" name="brush-size" min="1" max="5"/>

                </section>
                <section id="section-actions">
                    <h2 class="section-labels">Actions</h2>
                    <button id="btn-undo">undo</button>
                    <button id="btn-export">export png</button>
                    <button id="btn-clear">clear grid</button>
                </section>
                <section id="section-canvas-fill">
                    <h2 class="section-labels">Canvas Fill</h2>
                    <div id="fill-track">
                        <div id="fill-bar"></div>
                    </div>
                    <div id="fill-labels">
                        <span>0%</span>
                        <span id="fill-pct">0%</span>
                        <span>100%</span>
                    </div>
                </section>
            </div>
            <div id="canvas-area">
                <div id="grid-container"></div>
            </div>
        </div>
    </div>

    <!-- <script src="./scripts/app.js"></script> -->
</body>
</html>
